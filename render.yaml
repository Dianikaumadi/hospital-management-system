# Render Blueprint for the API. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: hospital-api
    runtime: node
    plan: free
    buildCommand: npm ci --workspace backend --include=dev && npm run build --workspace backend
    startCommand: npm start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
